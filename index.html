<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중대부초 놀이터</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 로딩 -->
  <div id="view-loading" class="center-screen">
    <p class="muted">불러오는 중…</p>
  </div>

  <!-- 로그인 화면 -->
  <div id="view-login" class="center-screen" hidden>
    <div class="login-card">
      <div class="logo">🎈</div>
      <h1>중대부초 놀이터</h1>
      <p class="muted">게임도 하고, 취미도 나누는 우리들의 공간</p>
      <button id="btn-google" class="btn btn-primary">
        <span class="g-mark">G</span> 구글로 로그인
      </button>
      <button id="btn-guest" class="btn btn-ghost">방문자로 들어가기</button>
      <p class="hint">방문자는 게임만 할 수 있어요. 게시물은 구글 로그인이 필요해요.</p>
      <p id="login-error" class="error" hidden></p>
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="view-app" hidden>
    <header class="topbar">
      <div class="brand">🎈 중대부초 놀이터</div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="games" role="tab">🎮 게임</button>
        <button class="tab" data-tab="posts" role="tab">📝 게시물</button>
        <button class="tab" data-tab="account" role="tab">👤 계정</button>
      </nav>
      <button class="me" id="me-chip" title="내 계정">
        <img id="me-photo" alt="" hidden>
        <span id="me-avatar" class="avatar-fallback"></span>
        <span id="me-name"></span>
      </button>
    </header>

    <main>
      <!-- 게임 -->
      <section id="tab-games" class="panel">
        <div id="game-list">
          <h2>게임</h2>
          <div id="game-grid" class="grid"></div>
        </div>
        <div id="game-player" hidden>
          <div class="player-bar">
            <button id="btn-game-back" class="btn btn-ghost btn-small">← 게임 목록</button>
            <strong id="game-title"></strong>
            <button id="btn-game-full" class="btn btn-ghost btn-small">전체 화면</button>
          </div>
          <div class="frame-wrap"><iframe id="game-frame" title="게임" allow="fullscreen; autoplay"></iframe></div>
        </div>
      </section>

      <!-- 게시물 -->
      <section id="tab-posts" class="panel" hidden>
        <h2>게시물</h2>
        <div id="posts-locked" class="notice" hidden>
          <p>🔒 게시물은 구글로 로그인한 친구만 볼 수 있고 쓸 수 있어요.</p>
          <button class="btn btn-primary btn-upgrade">구글 계정으로 로그인</button>
        </div>
        <div id="posts-area" hidden>
          <form id="post-form" class="card composer">
            <textarea id="post-text" rows="3" maxlength="2000" placeholder="무슨 이야기를 나눌까요?"></textarea>
            <div id="post-files-preview" class="file-chips"></div>
            <div class="composer-actions">
              <label class="btn btn-ghost btn-small">
                📎 사진·파일 추가
                <input id="post-files" type="file" multiple hidden>
              </label>
              <span id="post-status" class="muted"></span>
              <button id="post-submit" type="submit" class="btn btn-primary btn-small">올리기</button>
            </div>
          </form>
          <div id="post-list"></div>
          <p id="posts-empty" class="muted" hidden>아직 게시물이 없어요. 첫 글을 남겨 보세요!</p>
        </div>
      </section>

      <!-- 계정 -->
      <section id="tab-account" class="panel" hidden>
        <h2>계정</h2>
        <div class="card account">
          <img id="acc-photo" alt="" hidden>
          <span id="acc-avatar" class="avatar-fallback big"></span>
          <div>
            <div id="acc-name" class="acc-name"></div>
            <div id="acc-email" class="muted"></div>
            <span id="acc-type" class="badge"></span>
          </div>
        </div>
        <div class="account-actions">
          <button id="acc-upgrade" class="btn btn-primary btn-upgrade" hidden>구글 계정으로 로그인</button>
          <button id="btn-logout" class="btn btn-ghost">로그아웃</button>
        </div>
        <p id="acc-error" class="error" hidden></p>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
